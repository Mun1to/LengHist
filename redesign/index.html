<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Origin trial de Chrome para HTMLInCanvas: activa html-in-canvas para
         todos los visitantes de vibeset.dev, sin que toquen chrome://flags.
         Es lo que hace canvasui.dev. Se registra gratis en
         https://developer.chrome.com/origintrials y el token se pega aquí:
    <meta http-equiv="origin-trial" content="PEGAR_TOKEN_AQUI" />
    -->
    <title>Vibeset · Un sitio con todo lo que necesitas para construir en la web</title>
    <meta name="description" content="El estante que miras antes de empezar: lenguajes, herramientas, técnicas, componentes en vivo y skills para tu agente. Aquí se enseñan funcionando, no descritos." />
    <meta name="author" content="Munir Torres" />
    <!-- Verificación de Bing Webmaster Tools. No es un secreto: es un código
         público que solo sirve para demostrar que quien lo pone controla el
         dominio. Si se quita, Bing deja de reconocer el sitio como tuyo. -->
    <meta name="msvalidate.01" content="ED4499FB676D29EBFE7FFA172B8CCE31" />
    <meta name="color-scheme" content="dark light" />

    <!-- El tema se decide antes de que se pinte nada: si esto se hiciera desde
         React, quien tiene el tema oscuro vería un fogonazo blanco en cada carga.
         Es la misma cuenta que hace src/lib/tema.js, y es a propósito que esté
         escrita dos veces: aquí no puede haber ni un import. -->
    <script>
      (function () {
        var pref = 'sistema'
        try {
          var guardado = localStorage.getItem('vibeset-tema')
          if (guardado === 'claro' || guardado === 'oscuro' || guardado === 'sistema') pref = guardado
        } catch (e) { /* navegación privada */ }
        var sistemaOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var oscuro = pref === 'oscuro' || (pref === 'sistema' && sistemaOscuro)
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light'
        document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light'
      })()
    </script>
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://vibeset.dev/" />

    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vibeset" />
    <meta property="og:title" content="Vibeset · Un sitio con todo lo que necesitas para construir en la web" />
    <meta property="og:description" content="El estante que miras antes de empezar: lenguajes, herramientas, técnicas, componentes en vivo y skills para tu agente. Aquí se enseñan funcionando, no descritos." />
    <meta property="og:url" content="https://vibeset.dev/" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <!-- La tarjeta se regenera del catálogo con `pnpm tarjeta`, nunca a mano: la
         anterior siguió diciendo «Cien lenguajes. Una guía viva» meses después de
         que el sitio creciera a seis secciones. El ancho y el alto declarados
         evitan que algunos clientes tarden una carga extra en dibujarla. -->
    <meta property="og:image" content="https://vibeset.dev/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Los dos textos alternativos los reescribe el build contando el catálogo
         (`resumenDelCatalogo` en src/lib/totales.js), que es la misma cuenta con
         la que se dibuja la imagen. Lo que hay escrito aquí solo se ve mientras
         se trabaja en local. X lee su propio espacio de nombres y tiene su
         propia clave, así que hacen falta las dos etiquetas y no solo la de
         Open Graph. -->
    <meta property="og:image:alt" content="Vibeset · el catálogo entero" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vibeset · Un sitio con todo lo que necesitas para construir en la web" />
    <meta name="twitter:description" content="El estante que miras antes de empezar: lenguajes, herramientas, técnicas, componentes en vivo y skills para tu agente. Aquí se enseñan funcionando, no descritos." />
    <meta name="twitter:image" content="https://vibeset.dev/brand/og.png" />
    <meta name="twitter:image:alt" content="Vibeset · el catálogo entero" />

    <!-- Estilo del contenido que el build cocina dentro de `#pre`. Se ve solo
         mientras el bundle carga, así que va aquí y no en Tailwind: en ese
         momento la hoja de la aplicación puede no haber llegado todavía. -->
    <style>
      #pre { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1.5rem; font: 16px/1.6 Inter, system-ui, sans-serif; color: #18181b }
      [data-theme="dark"] #pre { color: #e4e4e7 }
      #pre h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; margin: 0 0 .5rem }
      #pre h2 { font-size: 1.05rem; font-weight: 700; margin: 1.75rem 0 .5rem }
      #pre p { margin: 0 0 .75rem; max-width: 44rem }
      #pre ul { list-style: none; padding: 0; margin: 0 0 1rem }
      #pre li { margin: .3rem 0 }
      #pre a { color: #4f46e5; text-decoration: none }
      [data-theme="dark"] #pre a { color: #a5b4fc }
      #pre .sec { opacity: .7 }
      #pre header ul { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-bottom: 2rem }
      #pre pre { overflow-x: auto; padding: .75rem; border-radius: .5rem; background: #f4f4f5 }
      [data-theme="dark"] #pre pre { background: #18181b }
      #pre code { font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace }
      #pre footer { margin-top: 2.5rem }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- El contenido que cocina el build para los robots que no ejecutan
         JavaScript. Va en un nodo aparte y NO dentro de `#root`: así se borra
         de forma explícita en main.jsx en vez de depender de cómo limpie React
         su contenedor. En desarrollo queda vacío y no estorba. -->
    <div id="pre"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
