<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Origin trial de Chrome para HTMLInCanvas: activa html-in-canvas para
         todos los visitantes de vibeset.dev, sin que toquen chrome://flags.
         Es lo que hace canvasui.dev. Se registra gratis en
         https://developer.chrome.com/origintrials y el token se pega aquí:
    <meta http-equiv="origin-trial" content="PEGAR_TOKEN_AQUI" />
    -->
    <title>Vibeset · Un sitio con todo lo que necesitas para construir en la web</title>
    <meta name="description" content="El estante que miras antes de empezar: 100 lenguajes, 64 herramientas de frontend, 41 técnicas de diseño, 12 componentes en vivo y 17 skills de agente. Gratis, bilingüe, sin registro y sin rastreo." />
    <meta name="author" content="Munir Torres" />
    <meta name="color-scheme" content="dark light" />

    <!-- El tema se decide antes de que se pinte nada: si esto se hiciera desde
         React, quien tiene el tema oscuro vería un fogonazo blanco en cada carga.
         Es la misma cuenta que hace src/lib/tema.js, y es a propósito que esté
         escrita dos veces: aquí no puede haber ni un import. -->
    <script>
      (function () {
        var pref = 'sistema'
        try {
          var guardado = localStorage.getItem('vibeset-tema')
          if (guardado === 'claro' || guardado === 'oscuro' || guardado === 'sistema') pref = guardado
        } catch (e) { /* navegación privada */ }
        var sistemaOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var oscuro = pref === 'oscuro' || (pref === 'sistema' && sistemaOscuro)
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light'
        document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light'
      })()
    </script>
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://vibeset.dev/" />

    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
